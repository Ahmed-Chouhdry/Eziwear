# /etc/nginx/sites-available/eziwear  ->  symlink into sites-enabled/
# Replace eziwear.example.com with your domain. Then:
#   sudo ln -s /etc/nginx/sites-available/eziwear /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d eziwear.example.com     # TLS

server {
    listen 80;
    listen [::]:80;
    server_name eziwear.example.com;

    # Angular static build
    root /var/www/eziwear/frontend/dist/frontend/browser;
    index index.html;

    # Cloudinary uploads go through the API (backend caps at 8 MB)
    client_max_body_size 12M;

    # API -> Node (PORT from /var/www/eziwear/.env, default 5002)
    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA routing — everything else serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for fingerprinted assets
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
