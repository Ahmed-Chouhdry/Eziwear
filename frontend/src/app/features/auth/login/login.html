<form class="af" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <header class="af__head">
    <h1 class="af__title">Sign in</h1>
    <p class="af__sub">Welcome back to EZiWear.</p>
  </header>

  <div class="field" [class.field--error]="form.controls.identifier.touched && form.controls.identifier.invalid">
    <label class="field__label" for="login-id">Email or phone</label>
    <input class="input" id="login-id" type="text" formControlName="identifier" autocomplete="username" />
    @if (form.controls.identifier.touched && form.controls.identifier.invalid) {
      <span class="field__error">Enter your email or phone number.</span>
    }
  </div>

  <div class="field" [class.field--error]="form.controls.password.touched && form.controls.password.invalid">
    <label class="field__label" for="login-pw">Password</label>
    <input class="input" id="login-pw" type="password" formControlName="password" autocomplete="current-password" />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <span class="field__error">Enter your password.</span>
    }
  </div>

  <div class="af__row">
    <a routerLink="/auth/forgot-password" class="af__link">Forgot password?</a>
  </div>

  <button class="btn btn--primary btn--lg btn--block" type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Signing in…' : 'Sign in' }}
  </button>

  <p class="af__foot">
    New here? <a routerLink="/auth/register" class="af__link">Create an account</a>
  </p>
</form>
