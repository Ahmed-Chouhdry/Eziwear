<section class="hero" aria-roledescription="carousel" aria-label="Featured">
  @for (slide of slides(); track slide.headline; let i = $index) {
    <div class="hero__slide" [class.is-active]="i === active()" [attr.aria-hidden]="i !== active()">
      <img class="hero__img" [src]="slide.image" [alt]="''" [attr.fetchpriority]="i === 0 ? 'high' : null" />
      <div class="hero__scrim"></div>

      <div class="container hero__content">
        <span class="hero__eyebrow">
          {{ slide.eyebrow }}
          @if (slide.vipTag) { <span class="hero__vip">VIP</span> }
        </span>
        <h1 class="hero__headline">{{ slide.headline }}</h1>
        @if (slide.sub) { <p class="hero__sub">{{ slide.sub }}</p> }
        <a class="btn btn--primary btn--lg" [routerLink]="slide.ctaLink">{{ slide.ctaLabel }}</a>
      </div>
    </div>
  }

  @if (slides().length > 1) {
    <div class="hero__dots" role="tablist" aria-label="Choose slide">
      @for (slide of slides(); track slide.headline; let i = $index) {
        <button
          class="hero__dot"
          [class.is-active]="i === active()"
          role="tab"
          [attr.aria-selected]="i === active()"
          [attr.aria-label]="'Slide ' + (i + 1)"
          (click)="go(i)"
        ></button>
      }
    </div>
  }
</section>
