<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>EZiWear — Premium Streetwear</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EZiWear — premium streetwear. Tracksuits, hoodies, tees, shirts and trousers. Move different. Wear EZiWear.">
  <meta name="theme-color" content="#0B0B0D">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    // Apply saved theme before first paint to avoid flash
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('theme');
        var t = q === 'dark' || q === 'light' ? q : localStorage.getItem('ezi-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
